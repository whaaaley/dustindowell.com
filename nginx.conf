# nginx server for the static vite-ssg build.
# vite-ssg uses dirStyle: 'nested', so every route is pre-rendered to
# <route>/index.html (e.g. /work -> /work/index.html). Unmatched paths fall
# back to the pre-rendered /not-found/index.html, which renders the SPA's
# catch-all NotFound route and lets the client router take over.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Drop the nginx version from error pages and the Server header.
    server_tokens off;

    # gzip text assets; the inlined HTML is large, so this matters most for HTML.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Hashed/static assets can cache hard. Fonts and images included.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # robots.txt / sitemap.xml: serve directly.
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # HTML routes: try the exact file, then the nested index.html for the route.
    # Unmatched paths get a real 404 status whose body is the pre-rendered
    # not-found page (served via error_page below), so the SPA's catch-all
    # NotFound route renders and the client router can take over.
    location / {
        try_files $uri $uri/index.html =404;

        # HTML is regenerated each deploy; never let a stale page stick.
        add_header Cache-Control "no-cache";
    }

    # Serve the pre-rendered not-found page as the 404 body, keeping a 404 status.
    error_page 404 /not-found/index.html;
    location = /not-found/index.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
