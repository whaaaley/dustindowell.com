# Fly.io config for the static personal site.
#
# Deploy under your PERSONAL Fly org, not any work org. First-time setup:
#   fly launch --no-deploy --org personal --name dustindowell
# (if the name is taken, try --name dustindowell-com and update `app` below)
#
# Subsequent deploys:
#   fly deploy
#
# This is a static nginx container that scales to zero between requests.

app = 'dustindowell' # placeholder: change if taken (e.g. 'dustindowell-com')
primary_region = 'ord' # Chicago, central US

[build]
dockerfile = 'Dockerfile'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0 # static site, fine to scale to zero

[[http_service.checks]]
grace_period = '5s'
interval = '30s'
timeout = '5s'
method = 'GET'
path = '/'

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
