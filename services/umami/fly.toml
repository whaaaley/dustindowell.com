app = 'dustindowell-umami'
primary_region = 'ord'

# Runs the upstream umami image directly; there is no Dockerfile to build.
[build]
image = 'ghcr.io/umami-software/umami:postgresql-latest'

[env]
HOSTNAME = 'fly-local-6pn'

# DATABASE_URL and APP_SECRET carry the Postgres DSN and session secret; set them via `fly secrets`, never here.

# The site worker proxies /umami/* to this app over the public Fly hostname, so the tracker stays first-party without a tunnel.
[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
